name: Deploy web app (GitHub Pages)

# Publishes the exact same app as a website, so Mac users (or anyone) can use it
# from a bookmarkable URL — always the latest version, no install or reinstall.
# The app already builds with relative asset paths (vite base './'), so the same
# build that ships in the desktop app works unchanged as a static site.
on:
  push:
    branches:
      - claude/blissful-albattani-2fzSF
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; let an in-flight deploy finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build web app
        run: npm run build
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
