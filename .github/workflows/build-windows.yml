name: Build Windows installer

# Pushing to this branch builds the installer as a downloadable artifact.
# If the commit message contains "[release]", it ALSO publishes a public
# GitHub Release (permanent download link + auto-update feed for installed apps).
on:
  workflow_dispatch:
  push:
    branches:
      - claude/blissful-albattani-2fzSF
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build installer (artifact only)
        if: ${{ !contains(github.event.head_commit.message, '[release]') }}
        run: npm run dist:win

      - name: Build and publish release
        if: ${{ contains(github.event.head_commit.message, '[release]') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release:win

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: OnboardingTracker-Windows
          path: release/*.exe
          if-no-files-found: error
