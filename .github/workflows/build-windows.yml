name: Build Windows installer

# Produces a downloadable Windows .exe installer without needing a local
# Windows machine. Run it from the Actions tab ("Run workflow"), or push a
# version tag like v0.1.0. The installer is uploaded as a build artifact.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer
        run: npm run dist:win

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: OnboardingTracker-Windows
          path: release/*.exe
          if-no-files-found: error
