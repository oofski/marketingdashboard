<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dental Clinic Manager</title>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #111827; background: #f3f4f6; }
button { font-family: inherit; cursor: pointer; }

/* ---------- LAYOUT ---------- */
.app { display: grid; grid-template-columns: 220px 1fr; min-height: 100vh; }
.sidebar { background: #1f2937; color: #f9fafb; padding: 16px; display: flex; flex-direction: column; }
.brand { font-weight: 700; font-size: 18px; padding: 12px 8px; border-bottom: 1px solid #374151; margin-bottom: 12px; }
.nav { display: flex; flex-direction: column; gap: 4px; flex: 1; }
.nav button { background: none; border: none; color: #d1d5db; text-align: left; padding: 10px 12px; border-radius: 6px; font-size: 14px; }
.nav button:hover { background: #374151; color: #fff; }
.nav button.active { background: #2563eb; color: #fff; }
.user-info { padding-top: 12px; border-top: 1px solid #374151; font-size: 12px; color: #9ca3af; }
.user-info strong { color: #fff; display: block; }
.main { padding: 24px; overflow-x: auto; }

/* ---------- COMPONENTS ---------- */
.page-title { margin: 0 0 4px 0; font-size: 24px; }
.page-subtitle { color: #6b7280; font-size: 14px; margin-bottom: 16px; }
.card { background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; padding: 20px; margin-bottom: 16px; box-shadow: 0 1px 2px rgba(0,0,0,0.04); }
.card h3 { margin: 0 0 12px 0; font-size: 16px; }

.btn { padding: 8px 14px; border: 1px solid #d1d5db; background: #fff; border-radius: 6px; font-size: 14px; transition: 0.15s; }
.btn:hover { background: #f9fafb; }
.btn-primary { background: #2563eb; color: #fff; border-color: #2563eb; }
.btn-primary:hover { background: #1d4ed8; }
.btn-danger { background: #dc2626; color: #fff; border-color: #dc2626; }
.btn-danger:hover { background: #b91c1c; }
.btn-sm { padding: 4px 10px; font-size: 12px; }

.input, .select, .textarea { width: 100%; padding: 8px 10px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 14px; font-family: inherit; }
.input:focus, .select:focus, .textarea:focus { outline: none; border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,0.15); }
.textarea { min-height: 80px; resize: vertical; }

.field { margin-bottom: 12px; }
.label { display: block; font-size: 12px; color: #6b7280; margin-bottom: 4px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }

.table { width: 100%; border-collapse: collapse; }
.table th, .table td { padding: 10px 12px; text-align: left; border-bottom: 1px solid #f3f4f6; font-size: 14px; }
.table th { background: #f9fafb; font-weight: 600; color: #6b7280; font-size: 12px; text-transform: uppercase; }
.table tr:hover td { background: #f9fafb; cursor: pointer; }
.badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: 600; background: #e5e7eb; color: #374151; }
.badge-danger { background: #fee2e2; color: #991b1b; }
.badge-success { background: #d1fae5; color: #065f46; }
.badge-info { background: #dbeafe; color: #1e40af; }

.alert-bar { background: #fef3c7; border-left: 4px solid #f59e0b; padding: 12px 16px; margin-bottom: 16px; border-radius: 4px; }
.alert-bar strong { color: #92400e; }

.empty { padding: 40px; text-align: center; color: #9ca3af; font-style: italic; }

/* ---------- MODAL ---------- */
.modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 20px; }
.modal { background: #fff; border-radius: 12px; padding: 24px; width: 100%; max-width: 600px; max-height: 90vh; overflow-y: auto; }
.modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid #e5e7eb; }
.modal-header h2 { margin: 0; font-size: 20px; }
.modal-footer { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; padding-top: 16px; border-top: 1px solid #e5e7eb; }

/* ---------- LOGIN ---------- */
.login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #2563eb 0%, #7c3aed 100%); }
.login-card { background: #fff; padding: 40px; border-radius: 12px; box-shadow: 0 20px 40px rgba(0,0,0,0.2); width: 100%; max-width: 380px; }
.login-card h1 { margin: 0 0 8px 0; text-align: center; }
.login-card .hint { text-align: center; color: #6b7280; font-size: 13px; margin-bottom: 20px; }
.login-error { background: #fee2e2; color: #991b1b; padding: 8px 12px; border-radius: 6px; font-size: 13px; margin-bottom: 12px; }

/* ---------- TOOTH CHART ---------- */
.tooth-chart { display: flex; flex-direction: column; gap: 12px; padding: 16px; background: #f9fafb; border-radius: 8px; }
.tooth-row { display: grid; grid-template-columns: repeat(16, 1fr); gap: 4px; }
.tooth { background: #fff; border: 2px solid #d1d5db; border-radius: 6px; aspect-ratio: 1; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 11px; font-weight: 600; transition: 0.15s; position: relative; }
.tooth:hover { border-color: #2563eb; transform: scale(1.05); }
.tooth.selected { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,0.3); }
.tooth.has-finding { color: #fff; }
.legend { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px; margin-top: 12px; }
.legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; }
.legend-swatch { width: 16px; height: 16px; border-radius: 4px; border: 1px solid #d1d5db; }

/* ---------- SIGNATURE ---------- */
.sig-canvas { width: 100%; height: 200px; border: 2px dashed #d1d5db; border-radius: 6px; background: #fff; cursor: crosshair; touch-action: none; }

</style>
</head>
<body>
<div id="root"></div>

<script>
/* ========================================================================
   DENTAL CLINIC MANAGER - Single file, vanilla JS, localStorage storage
   ======================================================================== */

/* ---------- STORAGE ---------- */
const STORAGE_KEY = 'dental_clinic_v1';

function loadDB() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return {
    nextId: 1,
    patients: [],
    visits: [],
    notes: [],
    findings: [],
    documents: [],
    users: [{ id: 1, username: 'admin', password: 'admin123', full_name: 'Administrator', role: 'admin' }],
    settings: {
      clinic_name: 'Sunrise Dental Clinic',
      clinic_address: '123 Main Street, Anytown, State 12345',
      clinic_phone: '(555) 123-4567',
      clinic_email: 'contact@sunrisedental.example',
      clinic_license: 'LIC-12345',
    },
  };
}
function saveDB() { localStorage.setItem(STORAGE_KEY, JSON.stringify(DB)); }
function newId() { return DB.nextId++; }

let DB = loadDB();
let session = null;
let currentView = { name: 'dashboard' };

/* ---------- TOOTH CONDITIONS ---------- */
const CONDITIONS = [
  { key: 'healthy', label: 'Healthy', color: '#10b981' },
  { key: 'cavity', label: 'Cavity', color: '#dc2626' },
  { key: 'filled', label: 'Filled', color: '#6366f1' },
  { key: 'crown', label: 'Crown', color: '#f59e0b' },
  { key: 'missing', label: 'Missing', color: '#6b7280' },
  { key: 'implant', label: 'Implant', color: '#0891b2' },
  { key: 'root_canal', label: 'Root Canal', color: '#7c3aed' },
  { key: 'sensitive', label: 'Sensitive', color: '#fb923c' },
  { key: 'extraction', label: 'Extraction Needed', color: '#991b1b' },
  { key: 'watch', label: 'Watch', color: '#eab308' },
];

function conditionColor(key) {
  return CONDITIONS.find((c) => c.key === key)?.color || '#fff';
}

/* ---------- RENDERING ---------- */
function el(tag, props = {}, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (k === 'class') node.className = v;
    else if (k === 'style' && typeof v === 'object') Object.assign(node.style, v);
    else if (k.startsWith('on') && typeof v === 'function') node.addEventListener(k.slice(2).toLowerCase(), v);
    else if (k === 'html') node.innerHTML = v;
    else if (v !== false && v != null) node.setAttribute(k, v);
  }
  for (const c of children.flat()) {
    if (c == null || c === false) continue;
    node.appendChild(c instanceof Node ? c : document.createTextNode(String(c)));
  }
  return node;
}

function render() {
  const root = document.getElementById('root');
  root.innerHTML = '';
  if (!session) { root.appendChild(LoginView()); return; }
  root.appendChild(AppShell());
}

/* ---------- LOGIN ---------- */
function LoginView() {
  let error = '';
  const wrap = el('div', { class: 'login-wrap' });
  const card = el('div', { class: 'login-card' });
  card.appendChild(el('h1', {}, 'Dental Clinic Manager'));
  card.appendChild(el('div', { class: 'hint' }, 'Default: admin / admin123'));

  const errBox = el('div');
  const userInput = el('input', { class: 'input', type: 'text', value: 'admin', placeholder: 'Username' });
  const passInput = el('input', { class: 'input', type: 'password', value: 'admin123', placeholder: 'Password' });

  const submit = el('button', { class: 'btn btn-primary', style: { width: '100%', marginTop: '12px' } }, 'Sign In');
  submit.addEventListener('click', () => {
    const u = DB.users.find((x) => x.username === userInput.value && x.password === passInput.value);
    if (!u) {
      errBox.innerHTML = '';
      errBox.appendChild(el('div', { class: 'login-error' }, 'Invalid credentials'));
      return;
    }
    session = { id: u.id, username: u.username, full_name: u.full_name, role: u.role };
    render();
  });

  card.appendChild(errBox);
  card.appendChild(el('div', { class: 'field' }, el('label', { class: 'label' }, 'Username'), userInput));
  card.appendChild(el('div', { class: 'field' }, el('label', { class: 'label' }, 'Password'), passInput));
  card.appendChild(submit);
  wrap.appendChild(card);
  return wrap;
}

/* ---------- APP SHELL ---------- */
function AppShell() {
  const app = el('div', { class: 'app' });
  app.appendChild(Sidebar());
  const main = el('div', { class: 'main' });
  main.appendChild(MainView());
  app.appendChild(main);
  return app;
}

function Sidebar() {
  const sb = el('div', { class: 'sidebar' });
  sb.appendChild(el('div', { class: 'brand' }, 'Dental Clinic'));
  const nav = el('div', { class: 'nav' });
  const items = [
    { key: 'dashboard', label: 'Dashboard' },
    { key: 'patients', label: 'Patients' },
    { key: 'archive', label: 'Documents' },
    { key: 'settings', label: 'Settings' },
  ];
  if (session.role === 'admin') items.push({ key: 'users', label: 'Users' });

  for (const item of items) {
    const btn = el('button', { class: currentView.name === item.key ? 'active' : '' }, item.label);
    btn.addEventListener('click', () => { currentView = { name: item.key }; render(); });
    nav.appendChild(btn);
  }
  sb.appendChild(nav);
  const userBlock = el('div', { class: 'user-info' });
  userBlock.appendChild(el('strong', {}, session.full_name));
  userBlock.appendChild(el('div', {}, session.role));
  const logout = el('button', { class: 'btn btn-sm', style: { marginTop: '8px', width: '100%' } }, 'Sign out');
  logout.addEventListener('click', () => { session = null; currentView = { name: 'dashboard' }; render(); });
  userBlock.appendChild(logout);
  sb.appendChild(userBlock);
  return sb;
}

function MainView() {
  switch (currentView.name) {
    case 'dashboard': return Dashboard();
    case 'patients': return PatientList();
    case 'patient': return PatientDetail(currentView.id);
    case 'visit': return VisitScreen(currentView.id);
    case 'archive': return ArchiveView();
    case 'settings': return SettingsView();
    case 'users': return UsersView();
    default: return Dashboard();
  }
}

/* ---------- DASHBOARD ---------- */
function Dashboard() {
  const wrap = el('div');
  wrap.appendChild(el('h1', { class: 'page-title' }, 'Dashboard'));
  wrap.appendChild(el('div', { class: 'page-subtitle' }, `Welcome back, ${session.full_name}`));

  const stats = el('div', { class: 'row-3' });
  stats.appendChild(StatCard('Patients', DB.patients.length));
  stats.appendChild(StatCard('Visits', DB.visits.length));
  stats.appendChild(StatCard('Documents', DB.documents.length));
  wrap.appendChild(stats);

  // Today's queue
  const today = new Date().toISOString().split('T')[0];
  const todays = DB.visits.filter((v) => (v.visit_date || '').startsWith(today));
  const queueCard = el('div', { class: 'card' });
  queueCard.appendChild(el('h3', {}, "Today's Queue"));
  if (todays.length === 0) {
    queueCard.appendChild(el('div', { class: 'empty' }, 'No visits scheduled today'));
  } else {
    const t = el('table', { class: 'table' });
    t.appendChild(el('thead', {}, el('tr', {},
      el('th', {}, 'Patient'), el('th', {}, 'Time'), el('th', {}, 'Reason'), el('th', {}, 'Status'))));
    const tb = el('tbody');
    for (const v of todays) {
      const p = DB.patients.find((x) => x.id === v.patient_id);
      if (!p) continue;
      const tr = el('tr', {},
        el('td', {}, el('strong', {}, `${p.last_name}, ${p.first_name}`)),
        el('td', {}, new Date(v.visit_date).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })),
        el('td', {}, v.reason || '—'),
        el('td', {}, el('span', { class: 'badge ' + (v.status === 'completed' ? 'badge-success' : 'badge-info') }, v.status)));
      tr.addEventListener('click', () => { currentView = { name: 'visit', id: v.id }; render(); });
      tb.appendChild(tr);
    }
    t.appendChild(tb);
    queueCard.appendChild(t);
  }
  wrap.appendChild(queueCard);

  // Recent documents
  const recentDocs = [...DB.documents].sort((a, b) => b.created_at.localeCompare(a.created_at)).slice(0, 10);
  const docsCard = el('div', { class: 'card' });
  docsCard.appendChild(el('h3', {}, 'Recent Documents'));
  if (recentDocs.length === 0) {
    docsCard.appendChild(el('div', { class: 'empty' }, 'No documents yet'));
  } else {
    const t = el('table', { class: 'table' });
    t.appendChild(el('thead', {}, el('tr', {},
      el('th', {}, 'Patient'), el('th', {}, 'Type'), el('th', {}, 'Created'))));
    const tb = el('tbody');
    for (const d of recentDocs) {
      const p = DB.patients.find((x) => x.id === d.patient_id);
      if (!p) continue;
      tb.appendChild(el('tr', {},
        el('td', {}, `${p.last_name}, ${p.first_name}`),
        el('td', {}, el('span', { class: 'badge badge-info' }, d.doc_type.replace('_', ' '))),
        el('td', {}, new Date(d.created_at).toLocaleString())));
    }
    t.appendChild(tb);
    docsCard.appendChild(t);
  }
  wrap.appendChild(docsCard);
  return wrap;
}

function StatCard(label, value) {
  const c = el('div', { class: 'card' });
  c.appendChild(el('div', { style: { fontSize: '12px', color: '#6b7280', textTransform: 'uppercase', fontWeight: 600 } }, label));
  c.appendChild(el('div', { style: { fontSize: '32px', fontWeight: 700, marginTop: '4px' } }, value));
  return c;
}

/* ---------- PATIENTS LIST ---------- */
function PatientList() {
  const wrap = el('div');
  const header = el('div', { style: { display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '16px' } });
  const titleBlock = el('div');
  titleBlock.appendChild(el('h1', { class: 'page-title' }, 'Patients'));
  titleBlock.appendChild(el('div', { class: 'page-subtitle' }, `${DB.patients.length} total`));
  header.appendChild(titleBlock);
  const addBtn = el('button', { class: 'btn btn-primary' }, '+ New Patient');
  addBtn.addEventListener('click', () => openPatientForm(null));
  header.appendChild(addBtn);
  wrap.appendChild(header);

  const card = el('div', { class: 'card' });
  const searchInput = el('input', { class: 'input', placeholder: 'Search by name, phone, or email...', style: { marginBottom: '12px' } });

  function renderTable(filter) {
    let list = DB.patients;
    if (filter) {
      const f = filter.toLowerCase();
      list = list.filter((p) =>
        (p.first_name + ' ' + p.last_name).toLowerCase().includes(f) ||
        (p.phone || '').includes(f) ||
        (p.email || '').toLowerCase().includes(f) ||
        String(p.id) === f);
    }
    tbody.innerHTML = '';
    if (list.length === 0) {
      const tr = el('tr');
      tr.appendChild(el('td', { colspan: '5', class: 'empty' }, 'No patients found'));
      tbody.appendChild(tr);
      return;
    }
    for (const p of list) {
      const allergies = p.allergies && p.allergies.trim();
      const tr = el('tr', {},
        el('td', {}, el('strong', {}, `${p.last_name}, ${p.first_name}`)),
        el('td', {}, p.date_of_birth || '—'),
        el('td', {}, p.phone || '—'),
        el('td', {}, p.email || '—'),
        el('td', {}, allergies ? el('span', { class: 'badge badge-danger' }, 'Allergies') : '—'));
      tr.addEventListener('click', () => { currentView = { name: 'patient', id: p.id }; render(); });
      tbody.appendChild(tr);
    }
  }

  searchInput.addEventListener('input', (e) => renderTable(e.target.value));

  card.appendChild(searchInput);
  const t = el('table', { class: 'table' });
  t.appendChild(el('thead', {}, el('tr', {},
    el('th', {}, 'Name'), el('th', {}, 'DOB'), el('th', {}, 'Phone'), el('th', {}, 'Email'), el('th', {}, 'Alerts'))));
  const tbody = el('tbody');
  t.appendChild(tbody);
  renderTable('');
  card.appendChild(t);
  wrap.appendChild(card);
  return wrap;
}

function openPatientForm(existing) {
  const backdrop = el('div', { class: 'modal-backdrop' });
  const modal = el('div', { class: 'modal' });
  modal.appendChild(el('div', { class: 'modal-header' },
    el('h2', {}, existing ? 'Edit Patient' : 'New Patient'),
    el('button', { class: 'btn', onclick: () => backdrop.remove() }, '✕')));

  const fields = [
    ['first_name', 'First Name'],
    ['last_name', 'Last Name'],
    ['date_of_birth', 'Date of Birth (YYYY-MM-DD)'],
    ['gender', 'Gender'],
    ['phone', 'Phone'],
    ['email', 'Email'],
    ['address', 'Address'],
    ['emergency_contact', 'Emergency Contact'],
    ['emergency_phone', 'Emergency Phone'],
    ['insurance_provider', 'Insurance Provider'],
    ['insurance_id', 'Insurance ID'],
  ];
  const inputs = {};
  const form = el('div');
  for (const [key, label] of fields) {
    const inp = el('input', { class: 'input', value: existing?.[key] || '' });
    inputs[key] = inp;
    form.appendChild(el('div', { class: 'field' }, el('label', { class: 'label' }, label), inp));
  }
  const textFields = [
    ['medical_history', 'Medical History'],
    ['allergies', 'Allergies'],
    ['current_medications', 'Current Medications'],
    ['notes', 'Notes'],
  ];
  for (const [key, label] of textFields) {
    const ta = el('textarea', { class: 'textarea' });
    ta.value = existing?.[key] || '';
    inputs[key] = ta;
    form.appendChild(el('div', { class: 'field' }, el('label', { class: 'label' }, label), ta));
  }
  modal.appendChild(form);

  const save = el('button', { class: 'btn btn-primary' }, 'Save Patient');
  save.addEventListener('click', () => {
    const data = {};
    for (const k of Object.keys(inputs)) data[k] = inputs[k].value;
    if (!data.first_name || !data.last_name) { alert('First and last name required'); return; }
    if (existing) {
      Object.assign(existing, data, { updated_at: new Date().toISOString() });
    } else {
      DB.patients.push({ id: newId(), ...data, created_at: new Date().toISOString(), updated_at: new Date().toISOString() });
    }
    saveDB();
    backdrop.remove();
    render();
  });
  modal.appendChild(el('div', { class: 'modal-footer' },
    el('button', { class: 'btn', onclick: () => backdrop.remove() }, 'Cancel'), save));

  backdrop.appendChild(modal);
  document.body.appendChild(backdrop);
}

/* ---------- PATIENT DETAIL ---------- */
function PatientDetail(id) {
  const p = DB.patients.find((x) => x.id === id);
  if (!p) return el('div', { class: 'empty' }, 'Patient not found.');

  const wrap = el('div');
  const back = el('button', { class: 'btn btn-sm', style: { marginBottom: '12px' } }, '← Patients');
  back.addEventListener('click', () => { currentView = { name: 'patients' }; render(); });
  wrap.appendChild(back);

  const header = el('div', { style: { display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '16px' } });
  const tb = el('div');
  tb.appendChild(el('h1', { class: 'page-title' }, `${p.first_name} ${p.last_name}`));
  tb.appendChild(el('div', { class: 'page-subtitle' }, `Patient #${p.id}`));
  header.appendChild(tb);
  const actions = el('div', { style: { display: 'flex', gap: '8px' } });
  const editBtn = el('button', { class: 'btn' }, 'Edit');
  editBtn.addEventListener('click', () => openPatientForm(p));
  actions.appendChild(editBtn);
  const consentBtn = el('button', { class: 'btn' }, 'Consent Form');
  consentBtn.addEventListener('click', () => openConsentForm(p));
  actions.appendChild(consentBtn);
  const visitBtn = el('button', { class: 'btn btn-primary' }, 'Start Visit');
  visitBtn.addEventListener('click', () => {
    const v = { id: newId(), patient_id: p.id, doctor_id: session.id, reason: '', status: 'open', visit_date: new Date().toISOString(), created_at: new Date().toISOString() };
    DB.visits.push(v);
    saveDB();
    currentView = { name: 'visit', id: v.id };
    render();
  });
  actions.appendChild(visitBtn);
  header.appendChild(actions);
  wrap.appendChild(header);

  // Alerts
  if ((p.allergies && p.allergies.trim()) || (p.medical_history && p.medical_history.trim()) || (p.current_medications && p.current_medications.trim())) {
    const alert = el('div', { class: 'alert-bar' });
    alert.appendChild(el('strong', {}, '⚠ Medical alerts: '));
    const parts = [];
    if (p.allergies?.trim()) parts.push('Allergies: ' + p.allergies);
    if (p.medical_history?.trim()) parts.push('History: ' + p.medical_history);
    if (p.current_medications?.trim()) parts.push('Medications: ' + p.current_medications);
    alert.appendChild(document.createTextNode(parts.join(' • ')));
    wrap.appendChild(alert);
  }

  // Info card
  const infoCard = el('div', { class: 'card' });
  infoCard.appendChild(el('h3', {}, 'Patient Information'));
  const rows = [
    ['DOB', p.date_of_birth], ['Gender', p.gender], ['Phone', p.phone], ['Email', p.email],
    ['Address', p.address], ['Emergency', `${p.emergency_contact || '—'} (${p.emergency_phone || '—'})`],

/* ---------- TOOTH CHART ---------- */
function ToothChart(visit) {
  const wrap = el('div');
  const chart = el('div', { class: 'tooth-chart' });

  const upper = el('div', { class: 'tooth-row' });
  for (let n = 1; n <= 16; n++) upper.appendChild(makeTooth(n, visit));
  chart.appendChild(upper);

  const lower = el('div', { class: 'tooth-row' });
  for (let n = 32; n >= 17; n--) lower.appendChild(makeTooth(n, visit));
  chart.appendChild(lower);

  // Legend
  const legend = el('div', { class: 'legend' });
  for (const c of CONDITIONS) {
    legend.appendChild(el('div', { class: 'legend-item' },
      el('div', { class: 'legend-swatch', style: { background: c.color } }),
      c.label));
  }
  chart.appendChild(legend);

  wrap.appendChild(chart);
  return wrap;
}

function makeTooth(n, visit) {
  const finding = DB.findings.find((f) => f.visit_id === visit.id && f.tooth_number === n);
  const div = el('div', { class: 'tooth' + (finding ? ' has-finding' : '') }, String(n));
  if (finding) div.style.background = conditionColor(finding.condition);
  div.addEventListener('click', () => openToothEditor(n, visit));
  return div;
}

function openToothEditor(n, visit) {
  const finding = DB.findings.find((f) => f.visit_id === visit.id && f.tooth_number === n) || { tooth_number: n };
  const backdrop = el('div', { class: 'modal-backdrop' });
  const modal = el('div', { class: 'modal' });
  modal.appendChild(el('div', { class: 'modal-header' },
    el('h2', {}, `Tooth #${n}`),
    el('button', { class: 'btn', onclick: () => backdrop.remove() }, '✕')));

  const condSelect = el('select', { class: 'select' });
  condSelect.appendChild(el('option', { value: '' }, '— No finding —'));
  for (const c of CONDITIONS) {
    const opt = el('option', { value: c.key }, c.label);
    if (finding.condition === c.key) opt.setAttribute('selected', 'selected');
    condSelect.appendChild(opt);
  }
  modal.appendChild(el('div', { class: 'field' }, el('label', { class: 'label' }, 'Condition'), condSelect));

  const surfacesInput = el('input', { class: 'input', value: finding.surfaces || '', placeholder: 'e.g. O, M, D, B, L, I' });
  modal.appendChild(el('div', { class: 'field' }, el('label', { class: 'label' }, 'Surfaces'), surfacesInput));

  const noteInput = el('textarea', { class: 'textarea' });
  noteInput.value = finding.note || '';
  modal.appendChild(el('div', { class: 'field' }, el('label', { class: 'label' }, 'Notes'), noteInput));

  const save = el('button', { class: 'btn btn-primary' }, 'Save');
  save.addEventListener('click', () => {
    const existing = DB.findings.find((f) => f.visit_id === visit.id && f.tooth_number === n);
    const data = {
      visit_id: visit.id, tooth_number: n,
      condition: condSelect.value, surfaces: surfacesInput.value, note: noteInput.value,
    };
    if (!data.condition) {
      if (existing) DB.findings = DB.findings.filter((f) => f !== existing);
    } else if (existing) {
      Object.assign(existing, data);
    } else {
      DB.findings.push({ id: newId(), ...data });
    }
    saveDB();
    backdrop.remove();
    render();
  });
  modal.appendChild(el('div', { class: 'modal-footer' },
    el('button', { class: 'btn', onclick: () => backdrop.remove() }, 'Cancel'), save));

  backdrop.appendChild(modal);
  document.body.appendChild(backdrop);
}

    'the dentist. The patient acknowledges that no guarantees have been made about treatment ' +
    'outcomes, and accepts financial responsibility for services rendered.'));

  modal.appendChild(el('div', { class: 'label' }, 'Signature'));
  const canvas = el('canvas', { class: 'sig-canvas', width: 600, height: 200 });
  modal.appendChild(canvas);
  setupSignature(canvas);

  clearBtn.addEventListener('click', () => clearSignature(canvas));
  modal.appendChild(clearBtn);

  save.addEventListener('click', () => {

    el('button', { class: 'btn', onclick: () => backdrop.remove() }, 'Cancel'), save));

  backdrop.appendChild(modal);
  document.body.appendChild(backdrop);
}

function setupSignature(canvas) {
  const ctx = canvas.getContext('2d');
  ctx.lineWidth = 2; ctx.lineCap = 'round'; ctx.strokeStyle = '#111';
  let drawing = false;
  function getPos(e) {
    const r = canvas.getBoundingClientRect();
    const x = (e.touches?.[0]?.clientX ?? e.clientX) - r.left;
    const y = (e.touches?.[0]?.clientY ?? e.clientY) - r.top;
    return { x: x * (canvas.width / r.width), y: y * (canvas.height / r.height) };
  }
  function start(e) { drawing = true; const p = getPos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); e.preventDefault(); }
  function move(e) { if (!drawing) return; const p = getPos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); e.preventDefault(); }
  function end() { drawing = false; }
  canvas.addEventListener('mousedown', start);
  canvas.addEventListener('mousemove', move);
  canvas.addEventListener('mouseup', end);
  canvas.addEventListener('mouseleave', end);
  canvas.addEventListener('touchstart', start);
  canvas.addEventListener('touchmove', move);
  canvas.addEventListener('touchend', end);
}
function clearSignature(canvas) { canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height); }
function isCanvasBlank(canvas) {
  const c = canvas.getContext('2d').getImageData(0, 0, canvas.width, canvas.height).data;
  for (let i = 3; i < c.length; i += 4) if (c[i] !== 0) return false;
  return true;
}

function generateConsentPDF(patient, signatureDataUrl) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();

  doc.setFontSize(18); doc.text(s.clinic_name, 105, 20, { align: 'center' });
  doc.setFontSize(10); doc.text(s.clinic_address, 105, 27, { align: 'center' });
  doc.text(s.clinic_phone, 105, 33, { align: 'center' });
  doc.setLineWidth(0.5); doc.line(20, 38, 190, 38);
  doc.setFontSize(16); doc.text('Informed Consent for Dental Treatment', 105, 48, { align: 'center' });
  doc.setFontSize(11);
  doc.text(`Patient: ${patient.first_name} ${patient.last_name}`, 20, 60);
  doc.text(`Date of Birth: ${patient.date_of_birth || '—'}`, 20, 67);
  doc.text(`Date: ${new Date().toLocaleDateString()}`, 20, 74);

  const text = 'By signing below, the patient consents to dental treatment including examinations, ' +
    'cleanings, x-rays, fillings, extractions, and other procedures as deemed necessary by the ' +
    'dentist. The patient acknowledges that:\n\n' +
    '• No guarantees have been made about treatment outcomes\n' +
    '• They have disclosed all relevant medical history, allergies, and medications\n' +
    '• They accept financial responsibility for services rendered\n' +
    '• They have had the opportunity to ask questions and have them answered\n' +
    '• Their medical information will be kept confidential under HIPAA';

  const split = doc.splitTextToSize(text, 170);
  doc.text(split, 20, 88);
  doc.text('Patient Signature:', 20, 180);
  doc.addImage(signatureDataUrl, 'PNG', 20, 185, 80, 30);
  doc.line(20, 218, 100, 218);
  doc.setFontSize(9); doc.text(new Date().toLocaleString(), 20, 225);

  const dataUrl = doc.output('datauristring');
  const docId = newId();
  localStorage.setItem('doc_' + docId, dataUrl);
  DB.documents.push({
    id: docId, patient_id: patient.id, doc_type: 'consent_form',
    signed: true, created_at: new Date().toISOString(),
  });
  saveDB();
  doc.save(`consent-${patient.last_name}-${Date.now()}.pdf`);
  render();
}

function generateTreatmentReport(visit, patient) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  const s = DB.settings;
  doc.setFontSize(18); doc.text(s.clinic_name, 105, 20, { align: 'center' });
  doc.setFontSize(10); doc.text(s.clinic_address, 105, 27, { align: 'center' });
  doc.line(20, 35, 190, 35);
  doc.setFontSize(16); doc.text('Treatment Report', 105, 45, { align: 'center' });

  doc.setFontSize(11);
  let y = 58;
  doc.text(`Patient: ${patient.first_name} ${patient.last_name}`, 20, y); y += 7;
  doc.text(`Patient ID: ${patient.id}`, 20, y); y += 7;
  doc.text(`Visit Date: ${new Date(visit.visit_date).toLocaleString()}`, 20, y); y += 7;
  doc.text(`Reason: ${visit.reason || '—'}`, 20, y); y += 12;

  // Alerts
  if (patient.allergies?.trim() || patient.medical_history?.trim()) {
    doc.setFontSize(12); doc.setTextColor(180, 30, 30);
    doc.text('Medical Alerts', 20, y); y += 6;
    doc.setFontSize(10);
    if (patient.allergies?.trim()) { doc.text('Allergies: ' + patient.allergies, 20, y); y += 6; }
    if (patient.medical_history?.trim()) { doc.text('History: ' + patient.medical_history, 20, y); y += 6; }
    doc.setTextColor(0, 0, 0); y += 4;
  }

  // Findings
  const findings = DB.findings.filter((f) => f.visit_id === visit.id);
  if (findings.length) {
    doc.setFontSize(12); doc.text('Tooth Findings', 20, y); y += 7;
    doc.setFontSize(10);
    for (const f of findings) {
      const line = `Tooth #${f.tooth_number}: ${f.condition || '—'}` +
        (f.surfaces ? ` (${f.surfaces})` : '') +
        (f.note ? ` — ${f.note}` : '');
      const split = doc.splitTextToSize(line, 170);
      doc.text(split, 20, y);
      y += split.length * 5 + 1;
      if (y > 270) { doc.addPage(); y = 20; }
    }
    y += 5;
  }

  // Notes
  const notes = DB.notes.filter((n) => n.visit_id === visit.id);
  if (notes.length) {
    if (y > 230) { doc.addPage(); y = 20; }
    doc.setFontSize(12); doc.text('Clinical Notes', 20, y); y += 7;
    doc.setFontSize(10);
    for (const n of notes) {
      const line = `[${n.category}] ${n.content}`;
      const split = doc.splitTextToSize(line, 170);
      doc.text(split, 20, y);
      y += split.length * 5 + 2;
      if (y > 270) { doc.addPage(); y = 20; }
    }
  }

  // Next appt + signature
  y = Math.max(y, 240);
  if (visit.next_appointment) { doc.text(`Next Appointment: ${visit.next_appointment}`, 20, y); y += 7; }
  doc.line(20, y + 15, 100, y + 15);
  doc.setFontSize(9); doc.text('Doctor signature', 20, y + 20);

  const dataUrl = doc.output('datauristring');
  const docId = newId();
  localStorage.setItem('doc_' + docId, dataUrl);
  DB.documents.push({
    id: docId, patient_id: patient.id, visit_id: visit.id, doc_type: 'treatment_report',
    created_at: new Date().toISOString(),
  });
  saveDB();
  doc.save(`report-${patient.last_name}-${Date.now()}.pdf`);
  render();
}

  dl.addEventListener('click', () => {
    const data = JSON.stringify(DB, null, 2);
    const blob = new Blob([data], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `dental-clinic-backup-${new Date().toISOString().split('T')[0]}.json`;

    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const newDB = JSON.parse(ev.target.result);
        DB = newDB;

        alert('Invalid backup file');
      }

function UsersView() {
  const wrap = el('div');
  const header = el('div', { style: { display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '16px' } });
  const tb = el('div');
  tb.appendChild(el('h1', { class: 'page-title' }, 'Users'));
  tb.appendChild(el('div', { class: 'page-subtitle' }, `${DB.users.length} account(s)`));
  header.appendChild(tb);
  const addBtn = el('button', { class: 'btn btn-primary' }, '+ Add User');
  addBtn.addEventListener('click', () => openUserForm());
  header.appendChild(addBtn);
  wrap.appendChild(header);

  const card = el('div', { class: 'card' });
  const t = el('table', { class: 'table' });
  t.appendChild(el('thead', {}, el('tr', {},
    el('th', {}, 'Username'), el('th', {}, 'Full Name'), el('th', {}, 'Role'), el('th', {}, 'Actions'))));
  const tbody = el('tbody');
  for (const u of DB.users) {
    const delBtn = el('button', { class: 'btn btn-sm btn-danger' }, 'Delete');
    delBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (u.id === session.id) return;
      if (confirm(`Delete user ${u.username}?`)) {
        DB.users = DB.users.filter((x) => x.id !== u.id);
        saveDB();
        render();
      }
    });
    if (u.id === session.id) delBtn.setAttribute('disabled', 'disabled');
    tbody.appendChild(el('tr', {},
      el('td', {}, el('strong', {}, u.username)),
      el('td', {}, u.full_name),
      el('td', {}, el('span', { class: 'badge badge-info' }, u.role)),
      el('td', {}, delBtn)));
  }
  t.appendChild(tbody);
  card.appendChild(t);
  wrap.appendChild(card);
  return wrap;
}

function openUserForm() {
  const backdrop = el('div', { class: 'modal-backdrop' });
  const modal = el('div', { class: 'modal' });
  modal.appendChild(el('div', { class: 'modal-header' },
    el('h2', {}, 'Add User'),
    el('button', { class: 'btn', onclick: () => backdrop.remove() }, '✕')));

  const username = el('input', { class: 'input' });
  const full_name = el('input', { class: 'input' });
  const password = el('input', { class: 'input', type: 'password' });
  const role = el('select', { class: 'select' });
  for (const r of ['doctor', 'staff', 'admin']) role.appendChild(el('option', { value: r }, r));

  modal.appendChild(el('div', { class: 'field' }, el('label', { class: 'label' }, 'Username'), username));
  modal.appendChild(el('div', { class: 'field' }, el('label', { class: 'label' }, 'Full Name'), full_name));
  modal.appendChild(el('div', { class: 'field' }, el('label', { class: 'label' }, 'Password'), password));
  modal.appendChild(el('div', { class: 'field' }, el('label', { class: 'label' }, 'Role'), role));

  const save = el('button', { class: 'btn btn-primary' }, 'Create');
  save.addEventListener('click', () => {
    if (!username.value || !password.value || !full_name.value) { alert('All fields required'); return; }
    if (DB.users.find((u) => u.username === username.value)) { alert('Username taken'); return; }
    DB.users.push({ id: newId(), username: username.value, password: password.value, full_name: full_name.value, role: role.value });
    saveDB();
    backdrop.remove();
    render();
  });
  modal.appendChild(el('div', { class: 'modal-footer' },
    el('button', { class: 'btn', onclick: () => backdrop.remove() }, 'Cancel'), save));

  backdrop.appendChild(modal);
  document.body.appendChild(backdrop);
}

/* ---------- BOOT ---------- */
render();
</script>
</body>
</html>
